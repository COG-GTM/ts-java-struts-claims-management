server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: settlement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${SPRING_DATASOURCE_USERNAME:settlement}
    password: ${SPRING_DATASOURCE_PASSWORD:settlement}
    hikari:
      schema: ${SETTLEMENT_SCHEMA:settlement}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${SETTLEMENT_SCHEMA:settlement}
    default-schema: ${SETTLEMENT_SCHEMA:settlement}
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health

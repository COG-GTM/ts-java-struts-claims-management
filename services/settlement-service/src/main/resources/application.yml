server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: settlement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${DB_USER:settlement}
    password: ${DB_PASSWORD:settlement}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

settlement:
  # SETTLE-R37: the legacy save stamps calculated_by with the Struts session
  # user. The service has no session, so the operator is a configured principal
  # defaulting to the transcript's supervisor login.
  operator: ${SETTLEMENT_OPERATOR:supervisor}

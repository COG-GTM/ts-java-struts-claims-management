spring.application.name=payment-service
server.port=${SERVER_PORT:8084}

# ADR-002 (as ADR-001): HSQLDB in memory, created from the monolith's own
# schema.sql and seed.sql by file path, so the fixture cannot drift from the
# legacy one. legacy.db.dir is relative to services/payment-service.
legacy.db.dir=../../src/main/resources/db

spring.datasource.url=jdbc:hsqldb:mem:northstar-payment
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=SA
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:${legacy.db.dir}/schema.sql
spring.sql.init.data-locations=file:${legacy.db.dir}/seed.sql
spring.sql.init.continue-on-error=false

# Parity profile only (make payment-run-parity): explicit database
# preconditions applied by POST /parity/reset, see ADR-002.
parity.enabled=false
parity.preconditions.file=../../parity/preconditions/payment.sql

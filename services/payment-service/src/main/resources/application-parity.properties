# "parity" profile (make payment-run-parity): enables POST /parity/reset, which
# tools/parity/payment_parity.py calls before every scenario to put the
# database into the scenario's declared precondition (ADR-002, "How parity is
# judged"). The precondition scripts live under parity/preconditions/payment;
# the directory is relative to services/payment-service. Nothing else differs
# from the plain profile.
parity.preconditions.dir=../../parity/preconditions/payment

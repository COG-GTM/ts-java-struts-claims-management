# Profile "parity" (make payment-service-run-parity): exposes /parity/* so that
# tools/parity/payment_parity.py can reset the database to the seed, apply the
# named precondition scripts of parity/preconditions/payment and read the
# PAYMENT rows back. Never enabled outside a parity run, and bound to loopback
# so /parity/* is not reachable from another host.
server.address=127.0.0.1
parity.preconditions.dir=../../parity/preconditions/payment

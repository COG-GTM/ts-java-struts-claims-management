name: NorthStar Claims CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/traceability.py reads the history of each rule, which a
          # shallow clone does not carry.
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Maven verification
        run: mvn -B verify
      - name: Capture deterministic transcripts
        run: make capture
      - name: Verify transcript stability
        run: git diff --exit-code transcripts/
      - name: Re-run the SPEC-PAY-001 proof against the legacy app
        run: make payment-spec-check
      - name: Regenerate the SPEC-PAY-001 view
        run: make payment-spec-html
      - name: Regenerate the traceability matrix
        run: make traceability
      - name: Verify the parity report and the traceability matrix are current
        run: git diff --exit-code parity/report.md parity/report.json docs/TRACEABILITY.md docs/specs/SPEC-PAY-001.html

  payment-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Payment service tests (ADR-002)
        run: make payment-test SERVICE_JAVA_HOME=$JAVA_HOME

name: NorthStar Claims CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Maven verification
        run: mvn -B verify
      - name: Capture deterministic transcripts
        run: make capture
      - name: Set up JDK 21 for the settlement service
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Settlement service tests
        run: make service-test SERVICE_JAVA_HOME="$JAVA_HOME"
      - name: Replay settlement transcripts against the service
        run: |
          make service-run SERVICE_JAVA_HOME="$JAVA_HOME" > service.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf "http://localhost:8083/settlement/detail?claimId=119" > /dev/null && break
            sleep 2
          done
          curl -sf "http://localhost:8083/settlement/detail?claimId=119" > /dev/null || { cat service.log; exit 1; }
          make parity
      - name: Traceability matcher self-test
        run: python3 tools/traceability.py --self-test
      - name: Regenerate the traceability matrix
        run: make traceability
      - name: Verify transcript, parity and traceability stability
        run: git diff --exit-code transcripts/ parity/report.json parity/report.md docs/TRACEABILITY.md

name: NorthStar Claims CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Maven verification
        run: mvn -B verify
      - name: Capture deterministic transcripts
        run: make capture
      - name: Verify transcript stability
        run: git diff --exit-code transcripts/

  settlement-service:
    runs-on: ubuntu-latest
    env:
      NS: ci-settlement
      PORT_OFFSET: "100"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/settlement-service/pom.xml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install replay dependency
        run: python3 -m pip install "pyyaml>=6,<7"
      - name: Build service
        run: make service-build
      - name: Test service
        run: make service-test
      - name: Lint service (checkstyle)
        run: make service-lint
      - name: SAST (spotbugs + find-sec-bugs)
        run: make sast
      - name: Start stack
        run: make up NS=$NS PORT_OFFSET=$PORT_OFFSET
      - name: Replay golden transcripts
        run: make parity NS=$NS PORT_OFFSET=$PORT_OFFSET MODULE=settlement
      - name: Verify transcripts untouched by replay
        run: git diff --exit-code transcripts/
      - name: Service logs
        if: failure()
        run: docker compose -p $NS -f docker-compose.yml logs
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            parity/report.md
            parity/report.json
      - name: Stop stack
        if: always()
        run: make down NS=$NS PORT_OFFSET=$PORT_OFFSET

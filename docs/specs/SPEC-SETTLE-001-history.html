es settlement 0.00).\n+Observed: settlement_deductible_floor;\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:32-34\n+\n+**SETTLE-R13 (v1)** — `cappedAtLimit` is true when the floored net amount is\n+strictly greater than the policy limit, and the settlement becomes the policy\n+limit. Claim 119 (limit 1000): net 4500.00 gives settlement 1000.00 capped, and\n+net 19900.00 (covered 20000.00, deductible 100.00) also gives 1000.00 capped.\n+Observed: settlement_calculate, settlement_policy_cap;\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:35-36\n+\n+**SETTLE-R14 (v1)** — Order of operations is fixed: depreciation, then\n+deductible, then the zero floor, then the cap, then rounding.\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:30-37\n+\n+**SETTLE-R15 (v1)** — Rounding is performed by exactly one statement,\n+`double rounded = Math.round(amount * 100.0) / 100.0;`, applied to the capped\n+amount only. It is binary double arithmetic, not decimal.\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:37\n+\n+**SETTLE-R16 (v1)** — Under SETTLE-R15 a covered amount of 1.005 (no deductible,\n+no depreciation, under the limit) produces a settlement amount of 1.00, i.e. the\n+half cent rounds down.\n+Observed: settlement_half_cent;\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:37\n+\n+**SETTLE-R17 (v1)** — Only the settlement amount is rounded. `coveredAmount`,\n+`deductibleApplied`, and `depreciation` are copied onto the result as supplied.\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:38-43\n+\n+**SETTLE-R18 (v1)** — The result carries `coveredAmount`, `deductibleApplied`,\n+`depreciation`, `cappedAtLimit`, and `settlementAmount`; the action then sets\n+`claimId` and places the result in request scope as `settlement`, with the\n+policy limit as `policyLimit`.\n+Read: src/main/java/com/northstar/claims/service/SettlementCalculator.java:38-45;\n+src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:38-42\n+\n+## Output\n+\n+**SETTLE-R19 (v1)** — Values on the settlement screens are written by the\n+`<ns:field>` tag as `<span id=\"f_NAME\">value<\/span>`, with `&`, `<`, `>`, and `\"`\n+escaped and a null value rendered as the empty string.\n+Read: src/main/java/com/northstar/claims/web/tag/FieldTag.java:34-46,79-85\n+\n+**SETTLE-R20 (v1)** — `type=\"money\"` formats the value with `String.format(\"%.2f\",\n+...)`, so amounts appear with exactly two decimals (for example settlement\n+1000.00, deductible 500.00).\n+Observed: settlement_calculate;\n+Read: src/main/java/com/northstar/claims/web/tag/FieldTag.java:52-59\n+\n+**SETTLE-R21 (v1)** — The display rounding of SETTLE-R20 is not the same as the\n+calculation rounding of SETTLE-R15: the covered amount 1.005 is displayed as\n+1.01 while the settlement amount computed from it is 1.00.\n+Observed: settlement_half_cent\n+\n+**SETTLE-R22 (v1)** — A value that cannot be parsed as a number is printed\n+unchanged by `type=\"money\"`. `cappedAtLimit` is declared as money on\n+calculate.jsp and therefore renders as `true` or `false`.\n+Observed: settlement_calculate, settlement_deductible_floor;\n+Read: src/main/webapp/WEB-INF/jsp/settlement/calculate.jsp:26;\n+src/main/java/com/northstar/claims/web/tag/FieldTag.java:52-58\n+\n+**SETTLE-R23 (v1)** — The calculate screen shows `coveredAmount`,\n+`deductibleApplied`, `depreciation`, `cappedAtLimit`, and `settlementAmount`, and\n+links to `detail.do?claimId=...` and `save.do`.\n+Read: src/main/webapp/WEB-INF/jsp/settlement/calculate.jsp:17-30\n+\n+## Persistence\n+\n+**SETTLE-R24 (v1)** — `/claims/settlement/calculate.do` writes nothing: no\n+SETTLEMENT row is created and the claim is untouched (claim 120 remains CLOSED\n+across a calculate request).\n+Observed: settlement_calculate, settlement_blank_deductible;\n+Read: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:20-43\n+\n+**SETTLE-R25 (v1)** — `/claims/settlement/save.do` takes the same four request\n+parameters and recomputes the settlement with the same calculator rather than\n+reusing a previously calculated result; claim 119 with covered 5000.00,\n+deductible 500.00, depreciation 0.00 saves 1000.00, the capped value of\n+SETTLE-R13.\n+Observed: settlement_save;\n+Read: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:24-33\n+\n+**SETTLE-R26 (v1)** — On the save path the claim and its policy are dereferenced\n+without a null check and there is no 10000 limit fallback, so a claimId with no\n+claim row raises an exception and reaches error.jsp per SETTLE-R06.\n+Read: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:25-33;\n+src/main/webapp/WEB-INF/struts-config.xml:59-60\n+\n+**SETTLE-R27 (v1)** — The saved row gets `settlement_id` = `max(settlement_id) + 1`\n+over the SETTLEMENT table, `claim_id` from the request, `calculated_by` from the\n+session `user` attribute, and the literal `calculated_date` `2019-04-01`.\n+Observed: settlement_save (savedBy supervisor);\n+Read: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:34-38;\n+src/main/java/com/northstar/claims/web/ClaimsActionSupport.java:61-75\n+\n+**SETTLE-R28 (v1)** — The insert writes all nine SETTLEMENT columns —\n+`settlement_id`, `claim_id`, `covered_amount`, `deductible_applied`,\n+`depreciation`, `capped_at_limit`, `settlement_amount`, `calculated_by`,\n+`calculated_date` — and stores the rounded settlement amount (1000.00 for claim\n+119).\n+Observed: settlement_save (settlement.claim.119.amount = 1000.00);\n+Read: src/main/java/com/northstar/claims/dao/SettlementDAO.java:118-137;\n+src/main/resources/db/schema.sql:92-104\n+\n+**SETTLE-R29 (v1)** — Save forwards to `/WEB-INF/jsp/settlement/save.jsp` with\n+status 200; that page shows the settlement amount (from the `settlementAmount`\n+request attribute) and `savedBy` from the session \n \n-Version: 0.1\n+Version: 0.2\n \n Scope: the settlement calculate, save, and detail request flows of the claims\n application. Every rule below is taken either from a recorded transcript\n@@ -55,8 +55,21 @@ src/main/java/com/northstar/claims/dao/PolicyDAO.java:173;\n src/main/resources/db/schema.sql:21;\n src/main/resources/db/seed.sql:49-50,253-254\n \n-**SETTLE-R08 (v1)** — On the calculate path, if the claim is not found, or the\n-claim's policy is not found, the policy limit falls back to 10000.\n+**SETTLE-R08 (v1, superseded by v2)** — On the calculate path, if the claim is\n+not found, or the claim's policy is not found, the policy limit falls back to\n+10000.\n+Read: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:25-31\n+\n+**SETTLE-R08 (v2)** — On the calculate path, if the claim is not found, or the\n+claim's policy is not found, the policy limit falls back to 10000. The request\n+still succeeds. Confirmed against the running application with the seeded\n+database: POST `/claims/settlement/calculate.do` with `claimId=9999`\n+(no such claim), `coveredAmount=100`, `deductible=10` returns 200 with\n+`settlementAmount` 90.00 and `cappedAtLimit` false; the same request with\n+`coveredAmount=20000` returns `settlementAmount` 10000.00 with `cappedAtLimit`\n+true, which exercises the 10000 value itself.\n+Observed: manual run against localhost Jetty (not a recorded transcript),\n+2026-09-23, seeded database;\n Read: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:25-31\n \n **SETTLE-R09 (v1)** — No Struts validation runs on the settlement actions\n@@ -219,6 +232,7 @@ src/main/java/com/northstar/claims/web/tag/FieldTag.java:60-75\n | SETTLE-R06 | v1 | Initial rule, version 0.1 |\n | SETTLE-R07 | v1 | Initial rule, version 0.1 |\n | SETTLE-R08 | v1 | Initial rule, version 0.1 |\n+| SETTLE-R08 | v2 | Version 0.2: added live-run evidence for the 10000 fallback (claimId 9999 returns 90.00 uncapped, and 10000.00 capped at 15:20 UTC", "sha": "0c8568c5869425186b6424855d8077d39d90c52f", "short": "0c8568c", "subject": "Extract the settlement slice into services/settlement-service (ADR-001)"}, "file": "services/settlement-service/src/test/java/com/northstar/settlement/web/SettlementDetailEndpointTest.java", "javadoc": "Rules: SETTLE-R19, SETTLE-R30.\nTranscript: none — read from\nsrc/main/java/com/northstar/claims/web/SettlementDetailAction.java:19-20\nand src/main/java/com/northstar/claims/web/tag/FieldTag.java:79-85: a\nclaim with no settlement row leaves the {@code settlement} attribute null\nand every field renders as the empty string. The seeded SETTLEMENT rows\nend at claim 120 (src/main/resources/db/seed.sql:613-614), so claim 9999\nhas none.", "line": 91, "name": "SettlementDetailEndpointTest#detailForAClaimWithNoSettlementIsEmpty"}], "text": "**SETTLE-R30 (v1)** — `/claims/settlement/detail.do` reads, it does not compute:\nit loads the settlement for `claimId` (default 119 per SETTLE-R02) with\n`select * from SETTLEMENT where claim_id = ? order by settlement_id desc`,\ntaking the first row, and forwards to `/WEB-INF/jsp/settlement/detail.jsp`. When\nthe claim has no settlement row the request attribute `settlement` is null.\nRead: src/main/java/com/northstar/claims/web/SettlementDetailAction.java:17-23;\nsrc/main/java/com/northstar/claims/dao/SettlementDAO.java:100-114;\nsrc/main/webapp/WEB-INF/struts-config.xml:357-363", "trail": [{"date": "2026-09-23 15:03 UTC", "files": ["docs/specs/SPEC-SETTLE-001.md"], "sha": "fe00df382cc896071b581fc2a709a21c8ca56712", "short": "fe00df3", "subject": "Add SPEC-SETTLE-001 v0.1: settlement calculation rules"}, {"date": "2026-09-23 15:20 UTC", "files": ["services/settlement-service/src/main/java/com/northstar/settlement/persistence/SettlementRepository.java", "services/settlement-service/src/main/java/com/northstar/settlement/web/SettlementController.java", "services/settlement-service/src/test/java/com/northstar/settlement/web/SettlementDetailE ,\n2019-03-01).", "line": 28, "name": "SettlementDetailEndpointTest#detailShowsTheSeededSettlementForClaim119"}], "text": "**SETTLE-R31 (v1)** — The detail screen shows the stored settlement id and claim\nid as `type=\"integer\"`, covered amount, deductible applied, depreciation and\nsettlement amount as `type=\"money\"`, `cappedAtLimit` as `type=\"text\"`,\n`calculatedBy` as plain text, and `calculatedDate` as `type=\"date\"` reformatted\nas `yyyy-MM-dd`.\nRead: src/main/webapp/WEB-INF/jsp/settlement/detail.jsp:10-26;\nsrc/main/java/com/northstar/claims/web/tag/FieldTag.java:60-75", "trail": [{"date": "2026-09-23 15:03 UTC", "files": ["docs/specs/SPEC-SETTLE-001.md"], "sha": "fe00df382cc896071b581fc2a709a21c8ca56712", "short": "fe00df3", "subject": "Add SPEC-SETTLE-001 v0.1: settlement calculation rules"}, {"date": "2026-09-23 15:20 UTC", "files": ["services/settlement-service/src/main/java/com/northstar/settlement/web/FieldFormatter.java", "services/settlement-service/src/main/java/com/northstar/settlement/web/SettlementController.java", "services/settlement-service/src/test/java/com/northstar/settlement/web/LegacyParametersTest.java", "services/settlement-service/src/test/java/com/northstar/settlement/web/SettlementDetailEndpointTest.java"], "sha": "0c8568c5869425186b6424855d8077d39d90c52f", "short": "0c8568c", "subject": "Extract the settlement slice into services/settlement-service (ADR-001)"}], "transcripts": [], "v": 1}], "spec": "docs/specs/SPEC-SETTLE-001.md", "spec_name": "SPEC-SETTLE-001"}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var byAnchor={};D.rows.forEach(function(r){byAnchor[r.anchor]=r;});
var byCommit={};D.commits.forEach(function(c){byCommit[c.short]=c;});
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];});}
function cLink(c){return c?'<a href="'+esc(D.repo)+'/commit/'+esc(c.sha)+'" target="_blank" rel="noopener"><code>'+esc(c.short)+'</code></a>':"-";}
function bLink(path,line,text){return '<a href="'+esc(D.repo)+'/blob/'+esc(D.link_ref)+'/'+esc(path)+(line?'#L'+line:'')+'" target="_blank" rel="noopener"><code>'+esc(text||(path+(line?':'+line:'')))+'</code></a>';}
function ruleBtn(a){var r=byAnchor[a];return '<button class="linkbtn" data-rule="'+esc(a)+'">'+esc(r?r.label:a)+'</button>';}
function statusBadge(r){var cls={Current:"b-current",Superseded:"b-superseded",Removed:"b-removed"}[r.status];var t=r.status+(r.status==="Superseded"&&r.successor?" by v"+(r.v+1):"");return '<span class="badge '+cls+'">'+esc(t)+'</span>';}
function verdictBadge(v){var cls=/^PASS/.test(v)?"b-pass":/^CHANGED/.test(v)?"b-changed":"b-other";return '<span class="badge '+cls+'">'+esc(v)+'</span>';}
function changeNames(r){return r.changes.map(function(c){return c.name.split("-").slice(0,2).join("-");});}

var ids={};D.rows.forEach(function(r){ids[r.id]=1;});
$("title").textContent=D.spec_name+" change history";
$("subtitle").innerHTML="Generated by <code>make spec-history</code> from the git history of <code>"+esc(D.spec)+"</code>, the test javadoc, <code>docs/changes/</code> and the parity files. Every claim below opens its evidence in the panel.";
var stats=[[D.current_version,"current spec version"],[D.commits.length,"commits to the spec"],[Object.keys(ids).length,"rule ids"],[D.rows.length,"rule versions"],[D.revised_ids.length,"revised rule ids"],[D.rows.filter(function(r){return r.changes.length;}).length,"versions with a change record"]];
$("stats").innerHTML=stats.map(function(s){return '<div class="stat"><b>'+esc(s[0])+'</b>'+esc(s[1])+'</div>';}).join("");

function commitSummary(c){var p=[];if(c.added.length)p.push("+"+c.added.length+" rule version"+(c.added.length>1?"s":""));if(c.edited.length)p.push(c.edited.length+" edited");if(c.superseded.length)p.push(c.superseded.length+" superseded");if(c.removed.length)p.push(c.removed.length+" removed");return p.join(", ")||"no rule change";}
$("timeline").innerHTML=D.commits.map(function(c){return '<div class="tnode" role="listitem"><span class="dot"></span><button data-commit="'+esc(c.short)+'"><div class="ver">v'+esc(c.version)+'</div><div class="meta"><code>'+esc(c.short)+'</code> · '+esc(c.date.slice(0,10))+'</div><div class="chg">'+esc(commitSummary(c))+'</div></button></div>';}).join("");
$("tl-table").innerHTML=D.commits.map(function(c){return '<tr><td>'+(c.version_before?esc(c.version_before)+" → ":"")+esc(c.version)+'</td><td><button class="linkbtn" data-commit="'+esc(c.short)+'"><code>'+esc(c.short)+'</code></button> '+esc(c.subject)+'</td><td>'+esc(c.date)+'</td><td>'+(c.added.length>3?c.added.length+" rule versions":c.added.map(ruleBtn).join(", ")||"-")+'</td><td>'+(c.edited.map(ruleBtn).join(", ")||"-")+'</td></tr>';}).join("");

var FILTERS=[["all","All"],["current","Current"],["superseded","Superseded"],["revised","Revised rules"],["chg","With change record"],["untested","No tests"]];
var state={f:"all",q:""};
$("filters").innerHTML=FILTERS.map(function(f){return '<button data-filter="'+f[0]+'" aria-pressed="'+(f[0]==="all")+'">'+f[1]+'</button>';}).join("");
function matches(r){
  var f=state.f;
  if(f==="current"&&r.status!=="Current")return false;
  if(f==="superseded"&&r.status!=="Superseded")return false;
  if(f==="revised"&&!r.revised)return false;
  if(f==="chg"&&!r.changes.length)return false;
  if(f==="untested"&&r.tests.length)return false;
  if(state.q){var hay=[r.label,r.text,r.status,r.introduced.short,r.introduced.subject].concat(r.tests.map(function(t){return t.name;}),changeNames(r),r.trail.map(function(t){return t.short;})).join(" ").toLowerCase();if(hay.indexOf(state.q)<0)return false;}
  return true;
}
var selected=null;
function renderRules(){
  var shown=D.rows.filter(matches);
  $("rules").innerHTML=shown.map(function(r){
    var par=r.transcripts.map(function(t){return verdictBadge(t.verdict.split(" ")[0]);}).join(" ")||'<span class="muted">-</span>';
    return '<tr class="rule'+(r.anchor===selected?' sel':'')+'" tabindex="0" data-rule="'+esc(r.anchor)+'"><td><b>'+esc(r.label)+'</b>'+(r.revised?' <span class="badge b-rev">revised</span>':'')+'</td><td>'+statusBadge(r)+'</td><td>v'+esc(r.intro_version)+' <code>'+esc(r.introduced.short)+'</code></td><td>'+(r.edits.length||'-')+'</td><td>'+(r.tests.length||'<span class="badge b-note">0</span>')+'</td><td>'+(changeNames(r).join(", ")||'-')+'</td><td>'+par+'</td></tr>';
  }).join("")||'<tr><td colspan="7" class="empty">No rule version matches.</td></tr>';
  $("count").textContent=shown.length+" of "+D.rows.length+" rule versions";
}
$("checks").innerHTML=D.checks.map(function(c){return '<tr><td>'+esc(c.check)+'</td><td><span class="badge '+(c.result==="OK"?"b-ok":"b-note")+'">'+esc(c.result)+'</span></td><td>'+esc(c.detail).replace(/`([^`]+)`/g,function(m,s){return byCommit[s]?'<button class="linkbtn" data-commit="'+s+'"><code>'+s+'</code></button>':'<code>'+s+'</code>';})+'</td></tr>';}).join("");

function sideBySide(oldTitle,oldHtml,newTitle,newHtml){return '<div class="side"><div><h4>'+oldTitle+'</h4><div class="rtext">'+oldHtml+'</div></div><div><h4>'+newTitle+'</h4><div class="rtext">'+newHtml+'</div></div></div>';}
function openRule(a,push){
  var r=byAnchor[a];if(!r)return;selected=a;
  var h='<h2>'+esc(r.label)+' '+statusBadge(r)+'</h2>';
  h+='<p class="muted">Section: '+esc(r.section)+(r.spec_line?' · '+bLink(D.spec,r.spec_line,"spec line "+r.spec_line):'')+'</p>';
  if(r.successor)h+='<p>Replaced by '+ruleBtn(r.successor)+'.</p>';
  h+='<h3>Old and new text</h3>';
  if(r.predecessor){h+=sideBySide(esc(r.predecessor.rule)+' (old) · '+ruleBtn(r.predecessor.anchor),r.predecessor.old_html,esc(r.label)+' (new)',r.predecessor.new_html);}
  r.edits.forEach(function(e){h+='<p>Edited in '+cLink(e.commit)+' (spec v'+esc(e.version)+'): '+(e.wording_same?'wording unchanged, re-wrapped and heading qualifier changed.':'<b>wording changed.</b>')+'</p>'+sideBySide("Before",e.old_html,"After",e.new_html);});
  if(!r.predecessor&&!r.edits.length)h+='<p class="muted">Unchanged since it was introduced.</p><div class="side" style="grid-template-columns:1fr"><div><div class="rtext">'+esc(r.text)+'</div></div></div>';
  h+='<h3>Introduced</h3><p>'+cLink(r.introduced)+' '+esc(r.introduced.subject)+'<br><span class="muted">'+esc(r.introduced.date)+' · spec version '+esc(r.intro_version)+' · <button class="linkbtn" data-commit="'+esc(r.introduced.short)+'">open this commit</button></span></p><p><span class="muted">Rule history row:</span> '+esc(r.history_row)+'</p>';
  h+='<h3>Tests ('+r.tests.length+')</h3>';
  h+=r.tests.length?r.tests.map(function(t){return '<details><summary><code>'+esc(t.name)+'</code></summary><p>'+bLink(t.file,t.line,t.file.split("/").pop()+":"+t.line)+(t.added?' · added in '+cLink(t.added)+' '+esc(t.added.subject):'')+'</p><pre>'+esc(t.javadoc)+'</pre></details>';}).join(""):'<p class="empty">No test javadoc cites this rule version.</p>';
  h+='<h3>Change records ('+r.changes.length+')</h3>';
  h+=r.changes.length?r.changes.map(function(c){return '<details open><summary><b>'+esc(c.title)+'</b></summary><p>'+bLink(c.file)+' · '+esc(c.status)+' · '+esc(c.date)+(c.added?' · added in '+cLink(c.added):'')+'</p><ul class="ev">'+c.excerpt.map(function(x){return '<li>'+bLink(c.file,x.line,"L"+x.line)+' '+esc(x.text)+'</li>';}).join("")+'</ul></details>';}).join(""):'<p class="empty">No change record names this rule version.</p>';
  h+='<h3>Transcripts and parity</h3>';
  h+=r.transcripts.length?'<ul class="ev">'+r.transcripts.map(function(t){return '<li>'+bLink("transcripts/"+t.name+".json",null,t.name)+' '+verdictBadge(t.verdict)+'</li>';}).join("")+'</ul>':'<p class="empty">No transcript is mapped to it in parity/routes.json.</p>';
  h+='<h3>Commits that mention it ('+r.trail.length+')</h3>';
  h+=r.trail.length?'<ul class="ev">'+r.trail.map(function(t){return '<li>'+cLink(t)+' '+esc(t.subject)+' <span class="muted">('+esc(t.date.slice(0,10))+')</span><br><span class="muted">'+t.files.map(esc).join(", ")+'</span></li>';}).join("")+'</ul>':'<p class="empty">None.</p>';
  $("panel").innerHTML=h;$("panel").scrollTop=0;
  renderRules();markTimeline(null);
  if(push!==false&&history.replaceState)history.replaceState(null,"","#"+a);
}
function diffHtml(d){return d.split("\n").map(function(l){var c=/^\+(?!\+\+)/.test(l)?"dl-add":/^-(?!--)/.test(l)?"dl-del":/^@@/.test(l)?"dl-hunk":"";return c?'<span class="'+c+'">'+esc(l)+'</span>':esc(l)+"\n";}).join("");}
function markTimeline(s){Array.prototype.forEach.call(document.querySelectorAll(".tnode button"),function(b){b.classList.toggle("sel",b.getAttribute("data-commit")===s);});}
function openCommit(s,push){
  var c=byCommit[s];if(!c)return;selected=null;
  var h='<h2>Spec version '+(c.version_before?esc(c.version_before)+' → ':'')+esc(c.version)+'</h2>';
  h+='<p>'+cLink(c)+' '+esc(c.subject)+'<br><span class="muted">'+esc(c.date)+' · <a href="'+esc(D.repo)+'/blob/'+esc(c.sha)+'/'+esc(D.spec)+'" target="_blank" rel="noopener">spec as of this commit</a></span></p>';
  function list(t,a){return a.length?'<h3>'+t+' ('+a.length+')</h3><p>'+a.map(ruleBtn).join(", ")+'</p>':"";}
  h+=list("Rule versions added",c.added)+list("Rule text edited",c.edited)+list("Marked superseded",c.superseded)+list("Removed",c.removed);
  if(c.history_rows.length)h+='<h3>Rule history rows added</h3><p>'+esc(c.history_rows.join(", "))+'</p>';
  h+='<h3>Diff of the spec</h3><pre class="diff">'+diffHtml(c.diff)+'</pre>';
  $("panel").innerHTML=h;$("panel").scrollTop=0;
  renderRules();markTimeline(s);
  if(push!==false&&history.replaceState)history.replaceState(null,"","#commit-"+s);
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-rule],[data-commit],[data-filter]");if(!t)return;
  if(t.hasAttribute("data-filter")){state.f=t.getAttribute("data-filter");Array.prototype.forEach.call(document.querySelectorAll("[data-filter]"),function(b){b.setAttribute("aria-pressed",String(b===t));});renderRules();return;}
  if(t.hasAttribute("data-rule"))openRule(t.getAttribute("data-rule"));else openCommit(t.getAttribute("data-commit"));
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr[data-rule]")){e.preventDefault();openRule(e.target.getAttribute("data-rule"));}});
$("search").addEventListener("input",function(){state.q=this.value.trim().toLowerCase();renderRules();});
renderRules();
var h=decodeURIComponent(location.hash.slice(1));
if(byAnchor[h])openRule(h,false);else if(/^commit-/.test(h)&&byCommit[h.slice(7)])openCommit(h.slice(7),false);
else{var rev=D.rows.filter(function(r){return r.predecessor;});if(rev.length)openRule(rev[rev.length-1].anchor,false);else openCommit(D.commits[D.commits.length-1].short,false);}
})();
</script>

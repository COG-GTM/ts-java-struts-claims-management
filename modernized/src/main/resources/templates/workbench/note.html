<th:block th:replace="~{fragments/layout :: header}"/>
<th:block th:replace="~{fragments/ns :: view('/WEB-INF/jsp/workbench/note.jsp')}"/>

<table class="page" cellpadding="0" cellspacing="0" border="0">
<tr><td class="banner"><h1><span th:text="#{app.title}"></span></h1></td></tr>
<tr><td class="navigation"><a href="/claims/policy/list.do"><span th:text="#{nav.policies}"></span></a> |
<a href="/claims/workbench/list.do"><span th:text="#{nav.workbench}"></span></a> |
<a href="/claims/report/openByAdjuster.do"><span th:text="#{nav.reports}"></span></a> |
<a href="/claims/logout.do"><span th:text="#{nav.logout}"></span></a></td></tr>
<tr><td class="content">

<th:block th:replace="~{fragments/layout :: nav}"/>
<h2><span th:text="#{workbench.note.heading}"></span></h2>
<form method="post" action="note.do">
<table class="form" cellpadding="3" cellspacing="0" border="0">
<tr><td><span th:text="#{claim.id}"></span></td>
<td><input name="claimId" th:value="${workbenchForm == null ? null : workbenchForm.claimId}"/></td></tr>
<tr><td><span th:text="#{claim.note}"></span></td>
<td><textarea name="noteText" rows="5" cols="50"></textarea></td></tr>
<tr><td>&nbsp;</td>
<td><button type="submit"><span th:text="#{button.save}"></span></button></td></tr>
</table>
</form>
<p><span th:text="#{workbench.note.instruction}"></span></p>
<th:block th:replace="~{fragments/layout :: audit}"/>
<th:block th:replace="~{fragments/layout :: footer}"/>

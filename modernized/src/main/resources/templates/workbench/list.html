<th:block th:replace="~{fragments/layout :: header}"/>
<th:block th:replace="~{fragments/ns :: view('/WEB-INF/jsp/workbench/list.jsp')}"/>

<table class="page" cellpadding="0" cellspacing="0" border="0">
<tr><td class="banner"><h1><span th:text="#{app.title}"></span></h1></td></tr>
<tr><td class="navigation"><a href="/claims/policy/list.do"><span th:text="#{nav.policies}"></span></a> |
<a href="/claims/workbench/list.do"><span th:text="#{nav.workbench}"></span></a> |
<a href="/claims/report/openByAdjuster.do"><span th:text="#{nav.reports}"></span></a> |
<a href="/claims/logout.do"><span th:text="#{nav.logout}"></span></a></td></tr>
<tr><td class="content">

<th:block th:replace="~{fragments/layout :: nav}"/>
<h2><span th:text="#{workbench.list.heading}"></span></h2>
<table class="results" cellpadding="3" cellspacing="0" border="1">
<tr>
<th><span th:text="#{claim.number}"></span></th>
<th><span th:text="#{claim.status}"></span></th>
<th><span th:text="#{claim.reserve}"></span></th>
<th><span th:text="#{claim.adjuster}"></span></th></tr>
<th:block th:each="claim : ${claims}">
<tr><td><a th:href="@{view.do(claimId=${claim.claimId})}"><span th:text="${claim.claimNumber}"></span></a></td>
<td><th:block th:replace="~{fragments/ns :: field(${'claimStatus_' + claim.claimId}, ${claim.status}, 'text')}"/></td>
<td><th:block th:replace="~{fragments/ns :: field(${'reserveAmount_' + claim.claimId}, ${claim.reserveAmount}, 'money')}"/></td>
<td><span th:text="${claim.assignedAdjuster}"></span></td></tr>
</th:block>
</table>
<p><span th:text="#{workbench.list.instruction}"></span></p>
<th:block th:replace="~{fragments/layout :: audit}"/>
<th:block th:replace="~{fragments/layout :: footer}"/>

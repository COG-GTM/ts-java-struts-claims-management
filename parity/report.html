   "change": "CHG-001",
   "record": "docs/changes/CHG-001-invalid-deductible.md",
   "rules": [

   ],
   "scenario": "settlement_bad_deductible",
   "summary": "A non-blank, unparseable deductible is a validation error instead of the error screen",
   "text": "# CHG-001 — An invalid deductible is a validation error, not the error screen\n\nStatus: Approved\nDate: 2026-09-23\nApplies to: `services/settlement-service` only. The Struts monolith under\n`src/main` is not changed.\nRules affected: SETTLE-R06 (v1 superseded by v2), SETTLE-R26 (unchanged),\nSETTLE-R09 (no longer holds for the service on this path)\n\n## Why\n\nA `deductible` that is not blank and does not parse as a number reaches\n`Double.parseDouble` unguarded in the legacy calculator\n(`src/main/java/com/northstar/claims/service/SettlementCalculator.java:28`),\nand the resulting `NumberFormatException` is caught by the global exception\nmapping and forwarded to `error.jsp`\n(`src/main/webapp/WEB-INF/struts-config.xml:59-60`). The operator sees a system\nerror screen for what is an input mistake: the screen carries no business\nfields and no validation errors (transcript `settlement_bad_deductible`), so\nnothing on it says which field was wrong or that retyping it would help.\n\nThe extracted service is required to treat this as input validation instead.\n\n## Before (legacy, and the service up to this change)\n\n`POST /settlement/calculate` with `claimId=119`, `coveredAmount=5000.00`,\n`deductible=abc`, `depreciation=0.00`:\n\n* legacy: status 200, `forward:/WEB-INF/jsp/error.jsp`, no business fields, no\n  validation errors (transcript `settlement_bad_deductible`);\n* service: status 500, screen `error`, no business fields, no validation errors\n  — parity on the status class per ADR-001 (\"How parity is judged\").\n\n`POST /settlement/save` with the same deductible threw out of the calculator\nbefore the insert, so nothing was written\n(`src/main/java/com/northstar/claims/web/SettlementSaveAction.java:34-39`).\n\n## After (service only)\n\nBoth endpoints check the deductible before calculating or writing:\n\n* the value is blank (null, empty, or whitespace only) — unchanged, it counts\n  as 0.00 and the calculation proceeds (SETTLE-R05);\n* the value is non-blank and `Double.parseDouble` rejects it — the response is\n  status 200, screen `calculate`, `fields` empty, and `errors` exactly\n  `[\"settlement.deductible.invalid\"]`;\n* any other value — unchanged.\n\nOn `POST /settlement/save` the check runs before the claim lookup and before\nthe insert, so a save with an invalid deductible writes no SETTLEMENT row and\nreturns the same status 200 / `calculate` screen / single validation error. The\nsave answer is the calculate screen rather than the save screen because no\nsettlement was produced to show, matching the calculate response exactly.\n\nUnchanged by this record: the arithmetic and its order, the rounding\n(`Math.round(amount * 100.0) / 100.0`), the parameter fallbacks (claimId 119,\ncoveredAmount 5000, depreciation 0, blank deductible 0, missing claim or policy\nlimit 10000 on calculate), and the save-path failure for a missing claim, which\nkeeps reaching the error screen (SETTLE-R26).\n\n## Rules affected\n\n| Rule | Effect |\n| --- | --- |\n| SETTLE-R06 (v1) | Legacy text kept, marked superseded for the service |\n| SETTLE-R06 (v2) | New text: status 200, calculate screen, no business fields, one validation error `settlement.deductible.invalid`, on calculate and on save, with no row written |\n| SETTLE-R05 (v1) | Unchanged — blank still means 0.00 |\n| SETTLE-R09 (v1) | Still describes the legacy (`validate=\"false\"`, always empty errors); the service now emits one validation key on this one path |\n| SETTLE-R26 (v1) | Unchanged — a missing claim on save still fails the request |\n\n## Tests\n\n* `SettlementCalculateEndpointTest.nonNumericDeductibleIsAValidationError`\n  (CHG-001) — `deductible=abc` on calculate gives 200, screen `calculate`,\n  empty `fields`, `errors` = `[\"settlement.deductible.invalid\"]`.\n* `SettlementCalculateEndpointTest.blankDeductibleForClaim120` — unchanged,\n  proves blank still means 0.00 (SETTLE-R05, transcript\n  `settlement_blank_deductible`).\n* `SettlementSaveEndpointTest.nonNumericDeductibleIsAValidationErrorAndWritesNothing`\n  (CHG-001) — `deductible=abc` on save gives the same response and the\n  SETTLEMENT row count is unchanged.\n* `SettlementSaveEndpointTest.saveAgainstAMissingClaimFails` — unchanged,\n  proves SETTLE-R26 still reaches the error screen.\n* `SettlementCalculatorTest` — unchanged; the calculator itself still throws on\n  a non-numeric deductible, the check sits in front of it.\n\n## Parity effect\n\n`transcripts/settlement_bad_deductible` no longer matches the service: the\ntranscript records the error screen with no validation errors, the service\nanswers the calculate screen with one. The difference is registered in\n`parity/routes.json` against this record, so `make parity` reports that\nscenario as `CHANGED (CHG-001)` instead of `PASS`, and still fails if the\nservice answers anything other than the approved response above. Every other\nsettlement scenario stays `PASS`.\n\nThe transcripts themselves are untouched: they are written only by\n`make capture` against the unchanged monolith, and `make capture` followed by\n`git diff --exit-code transcripts/` is clean.\n"
  },

   "text": "# CHG-002 — A payment above the latest saved settlement is rejected\n\nStatus: Approved\nDate: 2026-10-16\nApplies to: `services/payment-service` only. The Struts monolith under\n`src/main` is not changed and keeps issuing these payments.\nRules affected: PAY-R05 (v1 superseded by v2), PAY-R03 (unchanged),\nPAY-R04 (unchanged), PAY-R08 (no longer holds for the service on this path)\n\n## Why\n\nThe legacy issue action takes `amount` as typed and never compares it with the\nsettlement it pays against\n(`src/main/java/com/northstar/claims/web/PaymentIssueAction.java:23,30-31`).\nAny amount is issued, including one larger than the settlement the adjuster\nsaved. The extracted service is required to refuse such a payment.\n\n## Before (legacy, and the service up to this change)\n\nStarting from a fresh `make seed`, after transcript `settlement_save` has\nwritten settlement 121 for claim 119 at 1000.00, `POST /claims/payment/issue.do`\nwith `claimId=119`, `payeeName=Reserved Claimant`, `amount=1500.00`,\n`paymentMethod=CHECK`:\n\n* legacy: status 200, `forward:/WEB-INF/jsp/payment/issue.jsp`,\n  `paymentAmount` 1500.00, `checkNumber` CHK-61, `paymentStatus` ISSUED, and\n  PAYMENT 61 written for claim 119 against settlement 121 with amount 1500.0\n  (`parity/legacy/payment_issue_above_settlement.json`, written by\n  `make payment-legacy-observe`);\n* service before this change: the same issue screen and the same row.\n\n## After (service only)\n\n`POST /payment/issue` looks up the claim's latest settlement (PAY-R03), parses\n`amount` with the same fallback (PAY-R05), and then:\n\n* the parsed amount is greater than that settlement's `settlement_amount` — the\n  response is status 200, screen `issue`, `fields` empty and `errors` exactly\n  `[\"payment.amount.exceedsSettlement\"]`; no PAYMENT row is written and the\n  next `payment_id` is not consumed;\n* otherwise — unchanged, the payment is issued.\n\nDetails:\n\n* \"Greater\" compares the parsed double, unrounded: `1000.001` is above\n  `1000.00` and is rejected, although it would print as `1000.00`.\n* An amount equal to the settlement is issued. The omitted or unparseable\n  amount falls back to the settlement amount, so it is never rejected.\n* The check runs after the settlement lookup. A claim with no settlement still\n  reaches the error screen (PAY-R04); there is nothing to compare against.\n* The check runs before the insert, so a request that is both above the\n  settlement and missing `payeeName` or `paymentMethod` gets the validation\n  error, not the error screen of PAY-R07.\n* `NaN` is not greater than any number, so it is still issued as in the\n  legacy app.\n\nThe answer is the issue screen with a validation error, as CHG-001 does for an\ninvalid deductible: the request is an input mistake, not a system failure.\n\n## Rules affected\n\n| Rule | Effect |\n| --- | --- |\n| PAY-R05 (v1) | Legacy text kept, marked superseded for the service |\n| PAY-R05 (v2) | New text: an amount above the latest settlement gives status 200, the issue screen, no business fields, one validation error `payment.amount.exceedsSettlement`, and no row written |\n| PAY-R03 (v1) | Unchanged — the latest settlement is still the highest `settlement_id` |\n| PAY-R04 (v1) | Unchanged — a claim without a settlement still fails the request |\n| PAY-R08 (v1) | Still describes the legacy (`validate=\"false\"`, never any errors); the service now emits one validation key on this one path |\n\n## Tests\n\n* `PaymentIssueEndpointTest.issueAboveTheLatestSettlementIsAValidationErrorAndWritesNothing`\n  — 1500.00 against settlement 121 at 1000.00: 200, screen `issue`, empty\n  `fields`, the one key, row count and next id unchanged.\n* `PaymentIssueEndpointTest.anyFractionAboveTheSettlementIsRejected` —\n  1000.001 is rejected.\n* `PaymentIssueEndpointTest.amountsUpToTheSettlementAreIssued` — claim 118\n  (settlement 1118.00): 500 and 1118.00 are issued, 1118.01 is rejected.\n* `PaymentIssueEndpointTest.claimWithoutSettlementStillFailsBeforeTheCheck` —\n  claim 9999 is still the error screen.\n* `PaymentIssueEndpointTest.issueDefaultsClaimAndAmountFromTheLatestSettlement`\n  — the omitted amount falls back to the latest settlement and is issued.\n* The tests that issue 1000.00 for claim 119 (issue, history, detail,\n  remittance) now insert settlement 121 at 1000.00 first, the state the\n  transcripts were captured in. Against the bare seed, settlement 119 is 0.00\n  and the payment would be above it.\n\n## Parity effect\n\nThe seed gives claim 119 a settlement of 0.00, but the payment transcripts were\ncaptured after `settlement_save` saved 1000.00. Under this change that\ndifference matters, so payment scenarios now state their database:\n\n* `payment_issue` runs on `parity/preconditions/payment/capture-state.sql`\n  (seed plus settlement 121 at 1000.00). Its 1000.00 equals the settlement, so\n  it stays `PASS`; `payment_history` follows it and stays `PASS`.\n* `payment_issue_above_settlement` is a new scenario with no transcript. It\n  runs on its own precondition,\n  `parity/preconditions/payment/chg-002-above-settlement.sql`, sends 1500.00\n  for claim 119 and is judged against the response approved above, so\n  `make parity` reports it as `CHANGED (CHG-002)` and fails on anything else.\n  The legacy side of the comparison is in\n  `parity/legacy/payment_issue_above_settlement.json`.\n\nThe transcripts are untouched: `make capture` followed by\n`git diff --exit-code transcripts/` is clean.\n"
  }

   "note": "",

   "text": "After the issue, the database holds exactly one PAYMENT row\nfor claim 119 (`payment.count.claim.119` = 1) with `amount` 1000.00 and\n`status` `ISSUED` under id 61.\nObserved: payment_issue"
  },
  "PAY-R16 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "`/claims/payment/history.do` accepts GET with no parameters;\n`claimId` defaults per PAY-R02 and the response is 200 forwarded to\n`/WEB-INF/jsp/payment/history.jsp`. It writes nothing.\nRead: src/main/java/com/northstar/claims/web/PaymentHistoryAction.java:20-26.\nObserved: payment_history"
  },
  "PAY-R17 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "History lists the PAYMENT rows of the claim ordered by\n`payment_id` ascending (`select * from PAYMENT where claim_id = ? order by\npayment_id`).\nRead: src/main/java/com/northstar/claims/web/PaymentHistoryAction.java:21;\nsrc/main/java/com/northstar/claims/dao/PaymentDAO.java:100-119"
  },
  "PAY-R18 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "Each listed payment contributes three fields whose names are\nsuffixed with the payment id: `checkNumber_<id>`, `paymentAmount_<id>` (money)\nand `paymentStatus_<id>`. A claim with no payments produces no fields.\nRead: src/main/webapp/WEB-INF/jsp/payment/history.jsp:26-32.\nObserved: payment_history"
  },
  "PAY-R19 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "After payment_issue, history for claim 119 shows exactly\n`checkNumber_61` = `CHK-61`, `paymentAmount_61` = `1000.00`,\n`paymentStatus_61` = `ISSUED`.\nObserved: payment_history"
  },
  "PAY-R20 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "`/claims/payment/detail.do` takes `paymentId`; when it is\nmissing or not parseable the value 61 is used (the first payment the issue flow\ncreates). The response is 200 forwarded to `/WEB-INF/jsp/payment/detail.jsp`,\nand nothing is written.\nRead: src/main/java/com/northstar/claims/web/PaymentDetailAction.java:17-24;\nsrc/main/java/com/northstar/claims/web/ClaimsActionSupport.java:31-37"
  },
  "PAY-R21 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "Detail reads one row by primary key\n(`select * from PAYMENT where payment_id = ?`) and exposes it as the `payment`\nrequest attribute.\nRead: src/main/java/com/northstar/claims/web/PaymentDetailAction.java:18-19;\nsrc/main/java/com/northstar/claims/dao/PaymentDAO.java:26-44"
  },
  "PAY-R22 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "When no row has that id the DAO returns null, the JSP's\n`bean:write` on the missing bean throws, and the response is\n`/WEB-INF/jsp/error.jsp` with status 200 and no business fields.\nRead: src/main/java/com/northstar/claims/dao/PaymentDAO.java:34-37;\nsrc/main/webapp/WEB-INF/jsp/payment/detail.jsp:14;\nsrc/main/webapp/WEB-INF/struts-config.xml:59-60.\nConfirmed against the running legacy app (`paymentId=9999`, 2026-10-15)."
  },
  "PAY-R23 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "The detail screen shows `detailPaymentId` (integer),\n`detailPaymentClaim` (integer), `detailPaymentAmount` (money),\n`detailPaymentCheck`, `detailPaymentDate` (date) and `detailPaymentStatus`.\nRead: src/main/webapp/WEB-INF/jsp/payment/detail.jsp:10-24"
  },
  "PAY-R24 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "`/claims/payment/remittance.do` takes `claimId` (PAY-R02),\nlists the claim's payments in the order of PAY-R17, and answers 200 forwarded\nto `/WEB-INF/jsp/payment/remittance.jsp`. It writes nothing.\nRead: src/main/java/com/northstar/claims/web/PaymentRemittanceAction.java:17-24"
  },
  "PAY-R25 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "Each payment contributes `remitCheck_<id>`,\n`remitDate_<id>` (date), `remitAmount_<id>` (money) and `remitStatus_<id>`.\nRead: src/main/webapp/WEB-INF/jsp/payment/remittance.jsp:16-24"
  },
  "PAY-R26 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "The remittance screen also shows `remitClaimId` (integer),\n`remitCount` (integer; the size of the list) and `remitTotal` (money; the\ndatabase `coalesce(sum(amount),0)` over the claim's payments). A claim with no\npayments shows count 0 and total 0.00.\nRead: src/main/java/com/northstar/claims/web/PaymentRemittanceAction.java:19-22;\nsrc/main/java/com/northstar/claims/dao/PaymentDAO.java:122-137;\nsrc/main/webapp/WEB-INF/jsp/payment/remittance.jsp:28-32"
  },
  "PAY-R27 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "`type=\"money\"` formats the value with\n`String.format(\"%.2f\", Double.parseDouble(value))`, so `1000.0` prints as\n`1000.00`; a value that cannot be parsed is printed unchanged.\nRead: src/main/java/com/northstar/claims/web/tag/FieldTag.java:52-59.\nObserved: payment_issue"
  },
  "PAY-R28 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "`type=\"integer\"` prints the integer value of the string;\n`type=\"date\"` prints the stored date as `yyyy-MM-dd` (the DAO already reads\n`issued_date` as a `yyyy-MM-dd` string, so `2019-04-03` is shown as\n`2019-04-03`). A null value prints as an empty string.\nRead: src/main/java/com/northstar/claims/web/tag/FieldTag.java:60-75,79-85;\nsrc/main/java/com/northstar/claims/dao/PaymentDAO.java:167-179"
  },
  "PAY-R29 (v1)": {
   "note": "",
   "spec": "SPEC-PAY-001",
   "text": "All four payment paths require an authenticated session;\nthe login redirect is the session filter's behaviour and is not part of the\npayment slice.\nRead: src/main/java/com/northstar/claims/web/AuthFilter.java:31-42"
  },
  "SETTLE-R01 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "A settlement is calculated by POSTing `claimId`,\n`coveredAmount`, `deductible`, and `depreciation` to\n`/claims/settlement/calculate.do`; the response status is 200 and the request is\nforwarded to `/WEB-INF/jsp/settlement/calculate.jsp`.\nObserved: settlement_calculate"
  },
  "SETTLE-R02 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`claimId` is parsed as an integer; when it is missing or\nnot parseable the value 119 is used.\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:23;\nsrc/main/java/com/northstar/claims/web/ClaimsActionSupport.java:31-37"
  },
  "SETTLE-R03 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`coveredAmount` is parsed as a double; when it is missing\nor not parseable the value 5000 is used.\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:32;\nsrc/main/java/com/northstar/claims/web/ClaimsActionSupport.java:39-45"
  },
  "SETTLE-R04 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`depreciation` is parsed as a double; when it is missing or\nnot parseable the value 0 is used.\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:33;\nsrc/main/java/com/northstar/claims/web/ClaimsActionSupport.java:39-45"
  },
  "SETTLE-R05 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`deductible` has no numeric fallback. A null or empty\n`deductible` is replaced by the string `\"0\"` by the action, and the calculator\nindependently treats a null or whitespace-only string as 0. A blank deductible\ntherefore yields `deductibleApplied` 0.00 and a successful calculation.\nObserved: settlement_blank_deductible;\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:34-37;\nsrc/main/java/com/northstar/claims/service/SettlementCalculator.java:26-29"
  },
  "SETTLE-R06 (v1)": {
   "note": "superseded by v2",
   "spec": "SPEC-SETTLE-001",
   "text": "A non-empty, non-numeric `deductible`\nis passed to `Double.parseDouble` unguarded; the resulting exception is handled\nby the global exception mapping and the request is forwarded to\n`/WEB-INF/jsp/error.jsp` with status 200 and no validation errors.\nObserved: settlement_bad_deductible;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:28;\nsrc/main/webapp/WEB-INF/struts-config.xml:59-60"
  },
  "SETTLE-R06 (v2)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "A `deductible` that is not blank and does not parse as a\nnumber is rejected before the calculation and before any write: the response is\nstatus 200 on the calculate screen, with no business fields and exactly one\nvalidation error, key `settlement.deductible.invalid`. The same check runs on\nthe save path ahead of the insert, so no SETTLEMENT row is written. A blank\n(null, empty or whitespace-only) `deductible` still counts as 0 per SETTLE-R05.\nThis is a deliberate difference from the legacy behaviour of v1, which the\nmonolith keeps; it applies to `services/settlement-service` only.\nApproved: docs/changes/CHG-001-invalid-deductible.md;\nObserved: settlement_bad_deductible (the legacy behaviour the change departs\nfrom; recorded as CHANGED (CHG-001) in parity/routes.json);\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:28;\nsrc/main/webapp/WEB-INF/struts-config.xml:59-60"
  },
  "SETTLE-R07 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The policy limit used by the calculation is the\n`policy_limit` of the policy referenced by the claim's `policy_id`. Claim 119\nreferences policy 9001 (limit 1000) and claim 120 references policy 9002\n(limit 100000).\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:24-31;\nsrc/main/java/com/northstar/claims/dao/PolicyDAO.java:173;\nsrc/main/resources/db/schema.sql:21;\nsrc/main/resources/db/seed.sql:49-50,253-254"
  },
  "SETTLE-R08 (v1)": {
   "note": "superseded by v2",
   "spec": "SPEC-SETTLE-001",
   "text": "On the calculate path, if the claim is\nnot found, or the claim's policy is not found, the policy limit falls back to\n10000.\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:25-31"
  },
  "SETTLE-R08 (v2)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "On the calculate path, if the claim is not found, or the\nclaim's policy is not found, the policy limit falls back to 10000. The request\nstill succeeds. Confirmed against the running application with the seeded\ndatabase: POST `/claims/settlement/calculate.do` with `claimId=9999`\n(no such claim), `coveredAmount=100`, `deductible=10` returns 200 with\n`settlementAmount` 90.00 and `cappedAtLimit` false; the same request with\n`coveredAmount=20000` returns `settlementAmount` 10000.00 with `cappedAtLimit`\ntrue, which exercises the 10000 value itself.\nObserved: manual run against localhost Jetty (not a recorded transcript),\n2026-09-23, seeded database;\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:25-31"
  },
  "SETTLE-R09 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "No Struts validation runs on the settlement actions\n(`validate=\"false\"`), so `validation_errors` is always empty on these paths.\nRead: src/main/webapp/WEB-INF/struts-config.xml:206-222"
  },
  "SETTLE-R10 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Gross loss = `coveredAmount - depreciation`. With covered\n5000.00 and depreciation 500.00 the gross is 4500.00, which becomes the\nsettlement when no deductible or cap applies.\nObserved: settlement_blank_deductible;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:30"
  },
  "SETTLE-R11 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Net amount = gross - deductible. With covered 5000.00,\ndepreciation 0.00 and deductible 500.00 the net is 4500.00 before the cap.\nObserved: settlement_calculate;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:31"
  },
  "SETTLE-R12 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The net amount is floored at zero: when the deductible\nexceeds the gross loss the settlement is 0.00 and `cappedAtLimit` is false\n(covered 1000.00, deductible 2000.00 gives settlement 0.00).\nObserved: settlement_deductible_floor;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:32-34"
  },
  "SETTLE-R13 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`cappedAtLimit` is true when the floored net amount is\nstrictly greater than the policy limit, and the settlement becomes the policy\nlimit. Claim 119 (limit 1000): net 4500.00 gives settlement 1000.00 capped, and\nnet 19900.00 (covered 20000.00, deductible 100.00) also gives 1000.00 capped.\nObserved: settlement_calculate, settlement_policy_cap;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:35-36"
  },
  "SETTLE-R14 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Order of operations is fixed: depreciation, then\ndeductible, then the zero floor, then the cap, then rounding.\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:30-37"
  },
  "SETTLE-R15 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Rounding is performed by exactly one statement,\n`double rounded = Math.round(amount * 100.0) / 100.0;`, applied to the capped\namount only. It is binary double arithmetic, not decimal.\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:37"
  },
  "SETTLE-R16 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Under SETTLE-R15 a covered amount of 1.005 (no deductible,\nno depreciation, under the limit) produces a settlement amount of 1.00, i.e. the\nhalf cent rounds down.\nObserved: settlement_half_cent;\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:37"
  },
  "SETTLE-R17 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Only the settlement amount is rounded. `coveredAmount`,\n`deductibleApplied`, and `depreciation` are copied onto the result as supplied.\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:38-43"
  },
  "SETTLE-R18 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The result carries `coveredAmount`, `deductibleApplied`,\n`depreciation`, `cappedAtLimit`, and `settlementAmount`; the action then sets\n`claimId` and places the result in request scope as `settlement`, with the\npolicy limit as `policyLimit`.\nRead: src/main/java/com/northstar/claims/service/SettlementCalculator.java:38-45;\nsrc/main/java/com/northstar/claims/web/SettlementCalculateAction.java:38-42"
  },
  "SETTLE-R19 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Values on the settlement screens are written by the\n`<ns:field>` tag as `<span id=\"f_NAME\">value<\/span>`, with `&`, `<`, `>`, and `\"`\nescaped and a null value rendered as the empty string.\nRead: src/main/java/com/northstar/claims/web/tag/FieldTag.java:34-46,79-85"
  },
  "SETTLE-R20 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`type=\"money\"` formats the value with `String.format(\"%.2f\",\n...)`, so amounts appear with exactly two decimals (for example settlement\n1000.00, deductible 500.00).\nObserved: settlement_calculate;\nRead: src/main/java/com/northstar/claims/web/tag/FieldTag.java:52-59"
  },
  "SETTLE-R21 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The display rounding of SETTLE-R20 is not the same as the\ncalculation rounding of SETTLE-R15: the covered amount 1.005 is displayed as\n1.01 while the settlement amount computed from it is 1.00.\nObserved: settlement_half_cent"
  },
  "SETTLE-R22 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "A value that cannot be parsed as a number is printed\nunchanged by `type=\"money\"`. `cappedAtLimit` is declared as money on\ncalculate.jsp and therefore renders as `true` or `false`.\nObserved: settlement_calculate, settlement_deductible_floor;\nRead: src/main/webapp/WEB-INF/jsp/settlement/calculate.jsp:26;\nsrc/main/java/com/northstar/claims/web/tag/FieldTag.java:52-58"
  },
  "SETTLE-R23 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The calculate screen shows `coveredAmount`,\n`deductibleApplied`, `depreciation`, `cappedAtLimit`, and `settlementAmount`, and\nlinks to `detail.do?claimId=...` and `save.do`.\nRead: src/main/webapp/WEB-INF/jsp/settlement/calculate.jsp:17-30"
  },
  "SETTLE-R24 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`/claims/settlement/calculate.do` writes nothing: no\nSETTLEMENT row is created and the claim is untouched (claim 120 remains CLOSED\nacross a calculate request).\nObserved: settlement_calculate, settlement_blank_deductible;\nRead: src/main/java/com/northstar/claims/web/SettlementCalculateAction.java:20-43"
  },
  "SETTLE-R25 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`/claims/settlement/save.do` takes the same four request\nparameters and recomputes the settlement with the same calculator rather than\nreusing a previously calculated result; claim 119 with covered 5000.00,\ndeductible 500.00, depreciation 0.00 saves 1000.00, the capped value of\nSETTLE-R13.\nObserved: settlement_save;\nRead: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:24-33"
  },
  "SETTLE-R26 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "On the save path the claim and its policy are dereferenced\nwithout a null check and there is no 10000 limit fallback, so a claimId with no\nclaim row raises an exception and reaches error.jsp per SETTLE-R06.\nRead: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:25-33;\nsrc/main/webapp/WEB-INF/struts-config.xml:59-60"
  },
  "SETTLE-R27 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The saved row gets `settlement_id` = `max(settlement_id) + 1`\nover the SETTLEMENT table, `claim_id` from the request, `calculated_by` from the\nsession `user` attribute, and the literal `calculated_date` `2019-04-01`.\nObserved: settlement_save (savedBy supervisor);\nRead: src/main/java/com/northstar/claims/web/SettlementSaveAction.java:34-38;\nsrc/main/java/com/northstar/claims/web/ClaimsActionSupport.java:61-75"
  },
  "SETTLE-R28 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The insert writes all nine SETTLEMENT columns —\n`settlement_id`, `claim_id`, `covered_amount`, `deductible_applied`,\n`depreciation`, `capped_at_limit`, `settlement_amount`, `calculated_by`,\n`calculated_date` — and stores the rounded settlement amount (1000.00 for claim\n119).\nObserved: settlement_save (settlement.claim.119.amount = 1000.00);\nRead: src/main/java/com/northstar/claims/dao/SettlementDAO.java:118-137;\nsrc/main/resources/db/schema.sql:92-104"
  },
  "SETTLE-R29 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "Save forwards to `/WEB-INF/jsp/settlement/save.jsp` with\nstatus 200; that page shows the settlement amount (from the `settlementAmount`\nrequest attribute) and `savedBy` from the session user.\nObserved: settlement_save;\nRead: src/main/webapp/WEB-INF/struts-config.xml:214-222;\nsrc/main/webapp/WEB-INF/jsp/settlement/save.jsp:19-22"
  },
  "SETTLE-R30 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "`/claims/settlement/detail.do` reads, it does not compute:\nit loads the settlement for `claimId` (default 119 per SETTLE-R02) with\n`select * from SETTLEMENT where claim_id = ? order by settlement_id desc`,\ntaking the first row, and forwards to `/WEB-INF/jsp/settlement/detail.jsp`. When\nthe claim has no settlement row the request attribute `settlement` is null.\nRead: src/main/java/com/northstar/claims/web/SettlementDetailAction.java:17-23;\nsrc/main/java/com/northstar/claims/dao/SettlementDAO.java:100-114;\nsrc/main/webapp/WEB-INF/struts-config.xml:357-363"
  },
  "SETTLE-R31 (v1)": {
   "note": "",
   "spec": "SPEC-SETTLE-001",
   "text": "The detail screen shows the stored settlement id and claim\nid as `type=\"integer\"`, covered amount, deductible applied, depreciation and\nsettlement amount as `type=\"money\"`, `cappedAtLimit` as `type=\"text\"`,\n`calculatedBy` as plain text, and `calculatedDate` as `type=\"date\"` reformatted\nas `yyyy-MM-dd`.\nRead: src/main/webapp/WEB-INF/jsp/settlement/detail.jsp:10-26;\nsrc/main/java/com/northstar/claims/web/tag/FieldTag.java:60-75"
  }
 },

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vclass = v => v.split(' ')[0];
const inline = t => esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const state = {slice:'all', verdict:'all', q:'', sel:null, change:null};

function chips(){
  const n = {}; D.scenarios.forEach(s => n[vclass(s.verdict)] = (n[vclass(s.verdict)]||0)+1);
  $('chips').innerHTML = `<span class="chip" style="background:#eef1f6">${D.scenarios.length} scenarios</span>` +
    ['PASS','CHANGED','FAIL'].map(v => `<span class="chip ${v}">${v} ${n[v]||0}</span>`).join('') +
    `<span class="chip" style="background:#eef1f6">${D.changes.length} approved changes</span>`;
}
function filters(){
  const slices = ['all', ...new Set(D.scenarios.map(s => s.slice))];
  $('slice-filters').innerHTML = '<span class="muted">Slice</span>' + slices.map(s => `<button data-slice="${s}" class="${state.slice===s?'on':''}">${s}</button>`).join('');
  $('verdict-filters').innerHTML = '<span class="muted">Verdict</span>' + ['all','PASS','CHANGED','FAIL'].map(v => `<button data-verdict="${v}" class="${state.verdict===v?'on':''}">${v}</button>`).join('');
}
function visible(){
  const q = state.q.toLowerCase();
  return D.scenarios.filter(s => (state.slice==='all'||s.slice===state.slice) &&
    (state.verdict==='all'||vclass(s.verdict)===state.verdict) &&
    (!q || [s.scenario,s.description,s.verdict,s.change||'',s.rules.join(' ')].join(' ').toLowerCase().includes(q)));
}
function rows(){
  const list = visible();
  $('rows').innerHTML = list.map(s => `<tr data-s="${esc(s.scenario)}" class="${state.sel===s.scenario?'sel':''}"><td><code>${esc(s.scenario)}</code></td><td>${esc(s.description)}</td><td><span class="chip ${vclass(s.verdict)}">${esc(s.verdict)}</span></td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty">No scenario matches.</td></tr>';
}
function kv(obj){
  const keys = Object.keys(obj||{});
  if (!keys.length) return '<span class="empty">none</span>';
  return '<div class="kv">' + keys.sort().map(k => `<span>${esc(k)}</span><span><code>${esc(JSON.stringify(obj[k]))}</code></span>`).join('') + '</div>';
}
function answer(title, cls, a, extra){
  if (!a) return `<div class="col ${cls}"><h4>${title}</h4><p class="empty">${extra||'not recorded'}</p></div>`;
  return `<div class="col ${cls}"><h4>${title}</h4>
   <div class="kv"><span>status</span><span><code>${esc(a.status)}</code></span>
   <span>screen</span><span><code>${esc(a.screen||a.result||'')}</code></span></div>
   <h3>Business fields</h3>${kv(a.business_fields)}
   <h3>Validation errors</h3>${(a.validation_errors||[]).length?a.validation_errors.map(e=>'<div><code>'+esc(e)+'</code></div>').join(''):'<span class="empty">none</span>'}
   <h3>Database</h3>${kv(a.db_state)}${extra?'<p class="muted">'+extra+'</p>':''}</div>`;
}
function ruleBlock(key){
  const r = D.rules[key]; if (!r) return `<div class="rule"><b>${esc(key)}</b> <span class="muted">not in a spec</span></div>`;
  return `<div class="rule ${r.note?'sup':''}"><b>${esc(key)}</b> <span class="muted">${esc(r.spec)}${r.note?' · '+esc(r.note):''}</span><div>${inline(r.text).replace(/\n/g,' ')}</div></div>`;
}
function detail(){
  const s = D.scenarios.find(x => x.scenario === state.sel);
  if (!s){ $('detail').innerHTML = '<p class="empty">Select a scenario.</p>'; return; }
  const req = s.request || {};
  const act = s.actual ? {status:s.actual.status, screen:(s.actual.body||{}).screen, business_fields:(s.actual.body||{}).fields, validation_errors:(s.actual.body||{}).errors, db_state:s.actual.db_state} : null;
  $('detail').innerHTML = `<h2><code>${esc(s.scenario)}</code> <span class="chip ${vclass(s.verdict)}">${esc(s.verdict)}</span></h2>
   <p>${esc(s.description)}</p>
   ${s.difference && s.difference!=='-' ? `<p class="${vclass(s.verdict)}" style="padding:6px 8px;border-radius:6px">${esc(s.difference)}</p>`:''}
   ${s.change ? `<p>Approved by <a data-change="${esc(s.change)}">${esc(s.change)}</a> — <code>${esc(s.record)}</code></p>`:''}
   <h3>Request</h3><pre>${esc(req.method||'')} ${esc(req.path||'')}\n${esc(Object.keys(req.form||{}).sort().map(k=>k+'='+req.form[k]).join('\n'))}</pre>
   <h3>Database precondition</h3>${s.precondition ? `<p><code>parity/preconditions/payment/${esc(s.precondition)}</code> after the legacy schema.sql and seed.sql</p><pre>${esc(s.precondition_sql)}</pre>` : `<p class="muted">${s.slice==='payment' ? 'None: continues from the database the previous payment scenario left.' : 'The service fixture (legacy schema.sql and seed.sql).'}</p>`}
   ${s.legacy_setup.length ? `<p class="muted">Legacy side reached by replaying ${s.legacy_setup.map(x=>'<code>'+esc(x)+'</code>').join(', ')} from a fresh <code>make seed</code>.</p>`:''}
   <h3>Answers</h3><div class="cols">
   ${answer('Legacy', 'legacy', s.legacy, s.legacy_source ? '<code>'+esc(s.legacy_source)+'</code>' : '')}
   ${s.approved ? answer('Approved ('+esc(s.change)+')', 'approved', s.approved, '<code>parity/routes.json</code>') : ''}
   ${answer('Service', 'service', act, act ? '' : 'Service response not kept by this slice script; verdict only.')}
   </div>
   <h3>Rules</h3>${s.rules.length ? s.rules.map(ruleBlock).join('') : '<p class="empty">No rule mapped.</p>'}`;
}
function md(text){
  const lines = text.split('\n'); let out = '', list = false, table = [];
  const flushTable = () => { if (!table.length) return; const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    out += '<table><thead><tr>' + cells(table[0]).map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>' +
      table.slice(2).map(r => '<tr>' + cells(r).map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>').join('') + '</tbody></table>'; table = []; };
  let para = [];
  const flushPara = () => { if (para.length){ out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  for (const line of lines){
    if (line.startsWith('|')){ flushPara(); if (list){out+='</ul>';list=false;} table.push(line); continue; } else flushTable();
    let m;
    if ((m = line.match(/^(#{1,3}) (.*)/))){ flushPara(); if (list){out+='</ul>';list=false;} out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = line.match(/^\* (.*)/))){ flushPara(); if (!list){out+='<ul>';list=true;} out += '<li>' + inline(m[1]); }
    else if (/^\s+\S/.test(line) && list){ out += ' ' + inline(line.trim()); }
    else if (!line.trim()){ flushPara(); if (list){out+='</ul>';list=false;} }
    else { if (list){out+='</ul>';list=false;} para.push(line); }
  }
  flushPara(); flushTable(); if (list) out += '</ul>'; return out;
}
function changes(){
  $('change-rows').innerHTML = D.changes.map(c => `<tr data-c="${esc(c.change)}" class="${state.change===c.change?'sel':''}"><td><b>${esc(c.change)}</b></td><td>${esc(c.summary)}</td><td><code>${esc(c.scenario)}</code></td></tr>`).join('');
  const c = D.changes.find(x => x.change === state.change);
  if (!c){ $('change-detail').innerHTML = '<p class="empty">Select a change.</p>'; return; }
  const ids = [...new Set(c.rules.map(r => r.replace(/ \(v\d+\)$/,'')))];
  const versions = Object.keys(D.rules).filter(k => ids.some(id => k.startsWith(id+' ('))).sort();
  const s = D.scenarios.find(x => x.scenario === c.scenario);
  $('change-detail').innerHTML = `<h2>${esc(c.change)} <span class="chip CHANGED">${s?esc(s.verdict):'not replayed'}</span></h2><p>${esc(c.summary)}</p>
   <p>Scenario <a data-goto="${esc(c.scenario)}"><code>${esc(c.scenario)}</code></a> · record <code>${esc(c.record)}</code></p>
   <h3>Rule versions</h3>${versions.map(ruleBlock).join('')}
   <h3>Change record</h3><div class="md">${md(c.text)}</div>`;
}
function show(tab){
  $('view-scenarios').hidden = tab!=='scenarios'; $('view-changes').hidden = tab!=='changes';
  $('tab-scenarios').classList.toggle('on', tab==='scenarios'); $('tab-changes').classList.toggle('on', tab==='changes');
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1)); let m;
  if ((m = h.match(/^change=(.+)/))){ state.change = m[1]; show('changes'); changes(); }
  else { if ((m = h.match(/^scenario=(.+)/))) state.sel = m[1]; show('scenarios'); rows(); detail(); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-slice],[data-verdict],[data-s],[data-c],[data-change],[data-goto]'); if (!t) return;
  if (t.dataset.slice){ state.slice = t.dataset.slice; filters(); rows(); }
  else if (t.dataset.verdict){ state.verdict = t.dataset.verdict; filters(); rows(); }
  else if (t.dataset.s){ go('scenario=' + t.dataset.s); }
  else if (t.dataset.c){ go('change=' + t.dataset.c); }
  else if (t.dataset.change){ go('change=' + t.dataset.change); }
  else if (t.dataset.goto){ go('scenario=' + t.dataset.goto); }
});
function go(hash){ history.replaceState(null, '', '#' + hash); route(); }
$('q').addEventListener('input', e => { state.q = e.target.value; rows(); });
$('tab-scenarios').onclick = () => go(state.sel ? 'scenario=' + state.sel : '');
$('tab-changes').onclick = () => go('change=' + (state.change || (D.changes[D.changes.length-1]||{}).change || ''));
window.addEventListener('hashchange', route);
chips(); filters(); rows(); changes(); route();
</script>
